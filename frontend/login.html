<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — SafeHer</title>
  <link rel="stylesheet" href="/static/css/safeher.css" />
  <style>
    .auth-wrap { max-width: 400px; margin: 3rem auto; padding: 0 1rem; }
    .auth-logo { text-align: center; font-size: 1.8rem; font-weight: 800; color: var(--primary); margin-bottom: 1.5rem; }
    .auth-logo span { color: var(--accent); }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-logo">Safe<span>Her</span></div>
    <div class="sh-card">
      <div class="sh-card-title">Login to your account</div>
      <div id="alert" class="sh-alert"></div>
      <form id="loginForm">
        <div class="sh-form-group">
          <label>Email</label>
          <input type="email" id="email" class="sh-input" placeholder="you@example.com" required />
        </div>
        <div class="sh-form-group">
          <label>Password</label>
          <input type="password" id="password" class="sh-input" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-sh btn-primary btn-block">Login</button>
      </form>
      <p style="text-align:center;margin-top:1rem;font-size:0.85rem;">
        Don't have an account? <a href="/static/register.html" style="color:var(--primary)">Register</a>
      </p>
    </div>
  </div>
  <script src="/static/js/api.js"></script>
  <script>
    if (API.getToken()) window.location.href = '/static/dashboard.html';

    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.disabled = true; btn.textContent = 'Logging in…';
      try {
        const data = await API.post('/api/auth/login', {
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        });
        API.setToken(data.access_token);
        window.location.href = '/static/dashboard.html';
      } catch (err) {
        showAlert('alert', err.detail || 'Login failed');
        btn.disabled = false; btn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
