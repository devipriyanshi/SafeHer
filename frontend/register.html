<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — SafeHer</title>
  <link rel="stylesheet" href="/static/css/safeher.css" />
  <style>
    .auth-wrap { max-width: 420px; margin: 3rem auto; padding: 0 1rem; }
    .auth-logo { text-align: center; font-size: 1.8rem; font-weight: 800; color: var(--primary); margin-bottom: 1.5rem; }
    .auth-logo span { color: var(--accent); }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-logo">Safe<span>Her</span></div>
    <div class="sh-card">
      <div class="sh-card-title">Create your account</div>
      <div id="alert" class="sh-alert"></div>
      <form id="regForm">
        <div class="sh-form-group">
          <label>Full Name</label>
          <input type="text" id="full_name" class="sh-input" placeholder="Priya Sharma" required />
        </div>
        <div class="sh-form-group">
          <label>Email</label>
          <input type="email" id="email" class="sh-input" placeholder="you@example.com" required />
        </div>
        <div class="sh-form-group">
          <label>Phone (optional)</label>
          <input type="tel" id="phone" class="sh-input" placeholder="9876543210" />
        </div>
        <div class="sh-form-group">
          <label>Password</label>
          <input type="password" id="password" class="sh-input" placeholder="Min 8 characters" required />
        </div>
        <button type="submit" class="btn-sh btn-primary btn-block">Create Account</button>
      </form>
      <p style="text-align:center;margin-top:1rem;font-size:0.85rem;">
        Already have an account? <a href="/static/login.html" style="color:var(--primary)">Login</a>
      </p>
    </div>
  </div>
  <script src="/static/js/api.js"></script>
  <script>
    document.getElementById('regForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.disabled = true; btn.textContent = 'Creating…';
      try {
        const data = await API.post('/api/auth/register', {
          full_name: document.getElementById('full_name').value,
          email: document.getElementById('email').value,
          phone: document.getElementById('phone').value || null,
          password: document.getElementById('password').value,
        });
        API.setToken(data.access_token);
        window.location.href = '/static/dashboard.html';
      } catch (err) {
        showAlert('alert', err.detail || 'Registration failed');
        btn.disabled = false; btn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
